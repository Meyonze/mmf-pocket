name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Lint and build
        run: |
          chmod +x gradlew
          ./gradlew lint assembleDebug assembleRelease --stacktrace

      - name: Check MMF and WAV filename policy
        run: |
          mkdir -p build/audio-file-type-tests
          javac -encoding UTF-8 -d build/audio-file-type-tests app/src/main/java/app/mmfpocket/player/AudioFileTypes.java tools/AudioFileTypesTest.java
          java -cp build/audio-file-type-tests app.mmfpocket.player.AudioFileTypesTest

  native-security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17 for JNI bridge host tests
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and run PCM16 output oracle
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tools/pcm16-output-test.cpp -o pcm16-output-test
          ./pcm16-output-test

      - name: Build and run actual WAV and JNI bridge host tests
        run: |
          mkdir -p build/pcm16-bridge-synthetic
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Ithird_party/yamaha-smaf-player/src tools/pcm16-bridge-test.cpp third_party/yamaha-smaf-player/src/smaf_file.cpp third_party/yamaha-smaf-player/src/ma_fm_core.cpp third_party/yamaha-smaf-player/src/smaf_voice.cpp third_party/yamaha-smaf-player/src/ma_player.cpp -o pcm16-bridge-test
          ./pcm16-bridge-test build/pcm16-bridge-synthetic

      - name: Build and run progressive render-cache host tests
        run: |
          mkdir -p build/progressive-render-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/progressive-render-host app/src/main/java/app/mmfpocket/player/ProgressivePlayback.java tools/ProgressiveRenderTest.java tools/progressive-render-stubs/android/media/*.java tools/progressive-render-stubs/app/mmfpocket/player/NativeMmfRenderer.java
          java -cp build/progressive-render-host app.mmfpocket.player.ProgressiveRenderTest build/progressive-render-synthetic

      # Host doubles exercise coordination only, not Android audio behavior.
      - name: Build and run progressive playback coordination host tests
        run: |
          mkdir -p build/progressive-playback-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/progressive-playback-host app/src/main/java/app/mmfpocket/player/ProgressivePlayback.java tools/ProgressivePlaybackTest.java tools/progressive-playback-stubs/android/media/*.java tools/progressive-playback-stubs/app/mmfpocket/player/NativeMmfRenderer.java
          java -cp build/progressive-playback-host app.mmfpocket.player.ProgressivePlaybackTest build/progressive-playback-synthetic

      - name: Build and run Mafu visual measurements and PCM observer host tests
        run: |
          mkdir -p build/mafu-audio-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/mafu-audio-host app/src/main/java/app/mmfpocket/player/MafuAudioEnvelope.java app/src/main/java/app/mmfpocket/player/MafuWavAnalysis.java app/src/main/java/app/mmfpocket/player/MafuAudioVisualization.java app/src/main/java/app/mmfpocket/player/MafuAudioDance.java app/src/main/java/app/mmfpocket/player/ProgressivePlayback.java tools/MafuAudioTest.java tools/MafuReactionTest.java tools/MafuIntensityTest.java tools/MafuCadenceTest.java tools/MafuPcmObserverTest.java tools/ProgressiveRenderTest.java tools/progressive-render-stubs/android/media/*.java tools/progressive-render-stubs/app/mmfpocket/player/NativeMmfRenderer.java
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuAudioTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuReactionTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuIntensityTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuCadenceTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuPcmObserverTest build/mafu-observer-synthetic

      - name: Build and run optional Mafu analysis lifecycle host tests
        run: |
          mkdir -p build/mafu-analysis-host
          javac -encoding UTF-8 --release 17 -Xlint:all -cp build/mafu-audio-host -d build/mafu-analysis-host app/src/main/java/app/mmfpocket/player/MafuAudioAnalysis.java tools/MafuAnalysisLifecycleTest.java tools/mafu-analysis-stubs/android/content/*.java tools/mafu-analysis-stubs/android/content/res/*.java tools/mafu-analysis-stubs/android/net/*.java tools/mafu-analysis-stubs/android/os/*.java
          java -cp build/mafu-analysis-host:build/mafu-audio-host app.mmfpocket.player.MafuAnalysisLifecycleTest

      - name: Check actual Mafu pose math with host drawing stubs
        run: |
          mkdir -p build/mafu-view-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/mafu-view-host app/src/main/java/app/mmfpocket/player/MafuMesh.java app/src/main/java/app/mmfpocket/player/MafuAudioEnvelope.java app/src/main/java/app/mmfpocket/player/MafuAudioDance.java app/src/main/java/app/mmfpocket/player/IllustratedMafuMascotView.java tools/MafuPoseBoundsTest.java tools/MafuQuietMotionTest.java tools/mafu-view-stubs/android/content/*.java tools/mafu-view-stubs/android/graphics/*.java tools/mafu-view-stubs/android/os/*.java tools/mafu-view-stubs/android/view/*.java
          java -cp build/mafu-view-host app.mmfpocket.player.MafuPoseBoundsTest
          java -cp build/mafu-view-host app.mmfpocket.player.MafuQuietMotionTest

      - name: Build sanitizer smoke test
        run: >-
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -Ithird_party/yamaha-smaf-player/src
          tools/security-smoke.cpp
          third_party/yamaha-smaf-player/src/smaf_file.cpp
          third_party/yamaha-smaf-player/src/ma_fm_core.cpp
          third_party/yamaha-smaf-player/src/smaf_voice.cpp
          third_party/yamaha-smaf-player/src/ma_player.cpp
          -o security-smoke

      - name: Run sanitizer smoke test
        run: ./security-smoke

      - name: Build and run audio regression tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/audio-regression.cpp third_party/yamaha-smaf-player/src/smaf_file.cpp third_party/yamaha-smaf-player/src/ma_fm_core.cpp third_party/yamaha-smaf-player/src/smaf_voice.cpp third_party/yamaha-smaf-player/src/ma_player.cpp -o audio-regression
          ./audio-regression

      - name: Build and run recorded Audio resampling tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/recorded-resample-test.cpp third_party/yamaha-smaf-player/src/smaf_file.cpp third_party/yamaha-smaf-player/src/ma_fm_core.cpp third_party/yamaha-smaf-player/src/smaf_voice.cpp third_party/yamaha-smaf-player/src/ma_player.cpp -o recorded-resample-test
          ./recorded-resample-test

      - name: Build and run ATR resampling tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/atr-resample-test.cpp third_party/yamaha-smaf-player/src/smaf_file.cpp third_party/yamaha-smaf-player/src/ma_fm_core.cpp third_party/yamaha-smaf-player/src/smaf_voice.cpp third_party/yamaha-smaf-player/src/ma_player.cpp -o atr-resample-test
          ./atr-resample-test

      - name: Build and run scheduled tone inventory tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/tone-usage-audit.cpp third_party/yamaha-smaf-player/src/smaf_file.cpp third_party/yamaha-smaf-player/src/ma_fm_core.cpp third_party/yamaha-smaf-player/src/smaf_voice.cpp third_party/yamaha-smaf-player/src/ma_player.cpp -o tone-usage-audit
          ./tone-usage-audit --self-test

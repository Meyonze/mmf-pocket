name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Lint and build
        run: |
          chmod +x gradlew
          ./gradlew lint assembleDebug assembleRelease --stacktrace

  native-security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build sanitizer smoke test
        run: >-
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -Ithird_party/yamaha-smaf-player/src
          tools/security-smoke.cpp
          third_party/yamaha-smaf-player/src/smaf_file.cpp
          third_party/yamaha-smaf-player/src/ma_fm_core.cpp
          third_party/yamaha-smaf-player/src/smaf_voice.cpp
          third_party/yamaha-smaf-player/src/ma_player.cpp
          -o security-smoke

      - name: Run sanitizer smoke test
        run: ./security-smoke

      - name: Build and run audio regression tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/audio-regression.cpp third_party/yamaha-smaf-player/src/smaf_file.cpp third_party/yamaha-smaf-player/src/ma_fm_core.cpp third_party/yamaha-smaf-player/src/smaf_voice.cpp third_party/yamaha-smaf-player/src/ma_player.cpp -o audio-regression
          ./audio-regression

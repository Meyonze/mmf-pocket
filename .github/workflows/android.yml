name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Lint and build
        run: |
          chmod +x gradlew
          ./gradlew lint assembleDebug assembleRelease --stacktrace

      - name: Check MMF and WAV filename policy
        run: |
          mkdir -p build/audio-file-type-tests
          javac -encoding UTF-8 -d build/audio-file-type-tests app/src/main/java/app/mmfpocket/player/AudioFileTypes.java tools/AudioFileTypesTest.java
          java -cp build/audio-file-type-tests app.mmfpocket.player.AudioFileTypesTest

      - name: Check embedded MMF display metadata
        run: |
          mkdir -p build/mmf-metadata-tests
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/mmf-metadata-tests app/src/main/java/app/mmfpocket/player/MmfMetadata.java app/src/main/java/app/mmfpocket/player/SongDisplayText.java tools/MmfMetadataTest.java tools/SongDisplayTextTest.java
          java -cp build/mmf-metadata-tests app.mmfpocket.player.MmfMetadataTest
          java -cp build/mmf-metadata-tests app.mmfpocket.player.SongDisplayTextTest

  native-security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17 for JNI bridge host tests
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Build shared sanitizer synthesis library
        run: |
          cmake -S third_party/yamaha-smaf-player -B build/native-sanitizer \
            -DCMAKE_CXX_COMPILER=c++ -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build/native-sanitizer --target smaf --parallel 2

      - name: Build and run PCM16 output oracle
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tools/pcm16-output-test.cpp -o pcm16-output-test
          ./pcm16-output-test

      - name: Build and run actual WAV and JNI bridge host tests
        run: |
          mkdir -p build/pcm16-bridge-synthetic
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Ithird_party/yamaha-smaf-player/src tools/pcm16-bridge-test.cpp build/native-sanitizer/libsmaf.a -o pcm16-bridge-test
          ./pcm16-bridge-test build/pcm16-bridge-synthetic

      - name: Build and run progressive render-cache host tests
        run: |
          mkdir -p build/progressive-render-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/progressive-render-host app/src/main/java/app/mmfpocket/player/ProgressivePlayback.java tools/ProgressiveRenderTest.java tools/progressive-render-stubs/android/media/*.java tools/progressive-render-stubs/app/mmfpocket/player/NativeMmfRenderer.java
          java -cp build/progressive-render-host app.mmfpocket.player.ProgressiveRenderTest build/progressive-render-synthetic

      # Host doubles exercise coordination only, not Android audio behavior.
      - name: Build and run progressive playback coordination host tests
        run: |
          mkdir -p build/progressive-playback-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/progressive-playback-host app/src/main/java/app/mmfpocket/player/ProgressivePlayback.java tools/ProgressivePlaybackTest.java tools/progressive-playback-stubs/android/media/*.java tools/progressive-playback-stubs/app/mmfpocket/player/NativeMmfRenderer.java
          java -cp build/progressive-playback-host app.mmfpocket.player.ProgressivePlaybackTest build/progressive-playback-synthetic

      - name: Build and run Mafu visual measurements and PCM observer host tests
        run: |
          mkdir -p build/mafu-audio-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/mafu-audio-host app/src/main/java/app/mmfpocket/player/MafuAudioEnvelope.java app/src/main/java/app/mmfpocket/player/MafuWavAnalysis.java app/src/main/java/app/mmfpocket/player/MafuAudioVisualization.java app/src/main/java/app/mmfpocket/player/MafuAudioDance.java app/src/main/java/app/mmfpocket/player/ProgressivePlayback.java tools/MafuAudioTest.java tools/MafuReactionTest.java tools/MafuIntensityTest.java tools/MafuCadenceTest.java tools/MafuPcmObserverTest.java tools/ProgressiveRenderTest.java tools/progressive-render-stubs/android/media/*.java tools/progressive-render-stubs/app/mmfpocket/player/NativeMmfRenderer.java
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuAudioTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuReactionTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuIntensityTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuCadenceTest
          java -cp build/mafu-audio-host app.mmfpocket.player.MafuPcmObserverTest build/mafu-observer-synthetic

      - name: Build and run optional Mafu analysis lifecycle host tests
        run: |
          mkdir -p build/mafu-analysis-host
          javac -encoding UTF-8 --release 17 -Xlint:all -cp build/mafu-audio-host -d build/mafu-analysis-host app/src/main/java/app/mmfpocket/player/MafuAudioAnalysis.java tools/MafuAnalysisLifecycleTest.java tools/mafu-analysis-stubs/android/content/*.java tools/mafu-analysis-stubs/android/content/res/*.java tools/mafu-analysis-stubs/android/net/*.java tools/mafu-analysis-stubs/android/os/*.java
          java -cp build/mafu-analysis-host:build/mafu-audio-host app.mmfpocket.player.MafuAnalysisLifecycleTest

      - name: Check actual Mafu pose math with host drawing stubs
        run: |
          mkdir -p build/mafu-view-host
          javac -encoding UTF-8 --release 17 -Xlint:all -d build/mafu-view-host app/src/main/java/app/mmfpocket/player/MafuMesh.java app/src/main/java/app/mmfpocket/player/MafuAudioEnvelope.java app/src/main/java/app/mmfpocket/player/MafuAudioDance.java app/src/main/java/app/mmfpocket/player/IllustratedMafuMascotView.java tools/MafuPoseBoundsTest.java tools/MafuQuietMotionTest.java tools/mafu-view-stubs/android/content/*.java tools/mafu-view-stubs/android/graphics/*.java tools/mafu-view-stubs/android/os/*.java tools/mafu-view-stubs/android/view/*.java
          java -cp build/mafu-view-host app.mmfpocket.player.MafuPoseBoundsTest
          java -cp build/mafu-view-host app.mmfpocket.player.MafuQuietMotionTest

      - name: Build sanitizer smoke test
        run: >-
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -Ithird_party/yamaha-smaf-player/src
          tools/security-smoke.cpp
          build/native-sanitizer/libsmaf.a
          -o security-smoke

      - name: Run sanitizer smoke test
        run: ./security-smoke

      - name: Build and run audio regression tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/audio-regression.cpp build/native-sanitizer/libsmaf.a -o audio-regression
          ./audio-regression

      - name: Build and run silent-note voice pool tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/silent-note-pool-test.cpp build/native-sanitizer/libsmaf.a -o silent-note-pool-test
          ./silent-note-pool-test

      - name: Build and run remaining fixed-wave carrier tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-remaining-carrier-test.cpp build/native-sanitizer/libsmaf.a -o fm-remaining-carrier-test
          ./fm-remaining-carrier-test

      - name: Build and run gated-sine carrier tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-gated-sine-carrier-test.cpp build/native-sanitizer/libsmaf.a -o fm-gated-sine-carrier-test
          ./fm-gated-sine-carrier-test

      - name: Build and run clipped-sine carrier tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-clipped-sine-carrier-test.cpp build/native-sanitizer/libsmaf.a -o fm-clipped-sine-carrier-test
          ./fm-clipped-sine-carrier-test

      - name: Build and run rectified-carrier tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-rectified-carrier-test.cpp build/native-sanitizer/libsmaf.a -o fm-rectified-carrier-test
          ./fm-rectified-carrier-test

      - name: Build and run intrinsic-vibrato Nyquist tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-vibrato-nyquist-test.cpp build/native-sanitizer/libsmaf.a -o fm-vibrato-nyquist-test
          ./fm-vibrato-nyquist-test

      - name: Build and run VMA and HandyPhone bank isolation tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/vma-bank-regression-test.cpp build/native-sanitizer/libsmaf.a -o vma-bank-regression-test
          ./vma-bank-regression-test

      - name: Build and run recorded Audio resampling tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/recorded-resample-test.cpp build/native-sanitizer/libsmaf.a -o recorded-resample-test
          ./recorded-resample-test

      - name: Build and run ATR resampling tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/atr-resample-test.cpp build/native-sanitizer/libsmaf.a -o atr-resample-test
          ./atr-resample-test

      - name: Check aligned WAV comparison tool
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/compare-wav-test.py

      - name: Check fallback balance measurement tool
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/profile-fallback-balance-test.py

      - name: Check FM carrier spectral measurements
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-spectrum-audit.cpp build/native-sanitizer/libsmaf.a -o fm-spectrum-audit
          ./fm-spectrum-audit --self-test
          ./fm-spectrum-audit > /dev/null
          ./fm-spectrum-audit --bandlimited > /dev/null

      - name: Check unmodulated FM carrier bandlimiting
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-bandlimit-test.cpp build/native-sanitizer/libsmaf.a -o fm-bandlimit-test
          ./fm-bandlimit-test

      - name: Check ignored score instruction clocks
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/score-ignored-clock-test.cpp build/native-sanitizer/libsmaf.a -o score-ignored-clock-test
          ./score-ignored-clock-test

      - name: Check actual ATR source lifetime
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/atr-runtime-end-test.cpp build/native-sanitizer/libsmaf.a -o atr-runtime-end-test
          ./atr-runtime-end-test

      - name: Check recorded Audio source track binding
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/recorded-source-binding-test.cpp build/native-sanitizer/libsmaf.a -o recorded-source-binding-test
          ./recorded-source-binding-test

      - name: Check local renderer CLI contract
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/smaf-render-cli-test.py

      - name: Check original audio-probe generation
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/generate-audio-probes-test.py

      - name: Check original FM score probes and native binding
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/generate-fm-probes-test.py --native

      - name: Check FM phase through Nyquist suppression
        run: |
          mkdir -p build/fm-phase-tests
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/fm-phase-test.cpp build/native-sanitizer/libsmaf.a -o build/fm-phase-tests/fm-phase-test
          ./build/fm-phase-tests/fm-phase-test

      - name: Build and run Yamaha ADPCM reference tests
        run: |
          mkdir -p build/adpcm-tests
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/yamaha-adpcm-test.cpp -o build/adpcm-tests/yamaha-adpcm-test
          ./build/adpcm-tests/yamaha-adpcm-test

      - name: Build and run high-rate resampling tests
        run: |
          mkdir -p build/high-rate-tests
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/high-rate-resample-test.cpp build/native-sanitizer/libsmaf.a -o build/high-rate-tests/high-rate-resample-test
          ./build/high-rate-tests/high-rate-resample-test

      - name: Build and run scheduled tone inventory tests
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/tone-usage-audit.cpp build/native-sanitizer/libsmaf.a -o tone-usage-audit
          ./tone-usage-audit --self-test
          PYTHONDONTWRITEBYTECODE=1 python3 tools/tone-usage-audit-cli-test.py --binary ./tone-usage-audit
          PYTHONDONTWRITEBYTECODE=1 python3 tools/profile-fallback-balance-test.py --audit-binary ./tone-usage-audit FixturesTest.test_native_routes_and_note_times

      - name: Check score inventory input protection
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Ithird_party/yamaha-smaf-player/src tools/score-audit.cpp build/native-sanitizer/libsmaf.a -o score-audit
          PYTHONDONTWRITEBYTECODE=1 python3 tools/score-audit-cli-test.py --binary ./score-audit

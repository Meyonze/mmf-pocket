name: Test APK

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full source commit SHA with successful Android CI
        required: true
  push:
    branches: [audio-quality-r64]
    paths:
      - '.github/workflows/test-apk.yml'
      - 'tools/build-test-apk.py'

permissions:
  contents: read
  actions: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ inputs.commit || github.event.before }}
    steps:
      - name: Check out build tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false

      - name: Verify source commit and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          commit = os.environ['SOURCE_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}', commit), 'Full source SHA required'
          runs = json.loads(subprocess.check_output(['gh', 'api',
              f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/workflows/android.yml/runs?head_sha={commit}&per_page=10']))['workflow_runs']
          assert runs and runs[0]['head_sha'] == commit and runs[0]['conclusion'] == 'success', 'Exact source CI must pass'
          PY

      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and verify separate test APK
        run: python3 automation/tools/build-test-apk.py --source source test-apk

      - name: Upload test APK and checksum
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MMF-Pocket-test-${{ env.SOURCE_COMMIT }}
          path: test-apk/
          if-no-files-found: error
          retention-days: 14

      - name: Link download
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf 'Test APK (separate install)\n\n%s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

name: Test APK

# Builds an optimized APK for listening checks. It installs next to a public
# release (different application id and label) and is signed with a throwaway
# key generated on the runner, never the release key. Not for distribution.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Listening-test variant (none = the branch as committed)"
        type: choice
        default: none
        options:
          - none
          - d042
          - nopeg
          - nofade
          - vm25
          - ma25
  # Also runs when this file changes, so a new branch can build it before merge.
  push:
    paths:
      - .github/workflows/test-apk.yml

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Apply the listening-test variant (build-time only, never committed)
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          src=third_party/yamaha-smaf-player/src
          case "${VARIANT:-none}" in
            none) ;;
            d042) # MA7 FM phase-modulation depth back to the 1.6.8 value
              sed -i 's/kMa7PmDepth = 4.0;/kMa7PmDepth = 0.42;/' "$src/ma_fm_core.h"
              grep -q 'kMa7PmDepth = 0.42;' "$src/ma_fm_core.h" ;;
            nopeg) # do not accept the static Pitch-EG form (those voices play as before r94)
              sed -i 's/const bool staticPitchEg = flags == 7/const bool staticPitchEg = false \&\& flags == 7/' "$src/smaf_voice.cpp"
              grep -q 'staticPitchEg = false && flags == 7' "$src/smaf_voice.cpp" ;;
            ma25) # complete MA7 voices at the r96-r99 PM depth (2.5 cycles)
              sed -i 's/kMa7PmDepth = 4.0;/kMa7PmDepth = 2.5;/' "$src/ma_fm_core.h"
              grep -q 'kMa7PmDepth = 2.5;' "$src/ma_fm_core.h" ;;
            vm25) # VM35 phase-modulation depth as in r96-r98 (2.5 cycles)
              sed -i 's/kVm35ModDepth = kVm35PmDepth;/kVm35ModDepth = 2.5;/' "$src/ma_fm_core.cpp"
              grep -q 'kVm35ModDepth = 2.5;' "$src/ma_fm_core.cpp" ;;
            nofade) # no 16 ms attack fade
              sed -i 's/kMa7WtAttackFadeMs = 16.0/kMa7WtAttackFadeMs = 0.0/' "$src/ma_player.h"
              grep -q 'kMa7WtAttackFadeMs = 0.0' "$src/ma_player.h" ;;
            *) echo "unknown variant"; exit 1 ;;
          esac
          if [ "${VARIANT:-none}" != none ]; then
            sed -i "s/RENDER_CACHE_VERSION = \"r100-ma7-depth4-v1\"/RENDER_CACHE_VERSION = \"r100-ma7-depth4-v1-${VARIANT}\"/" app/src/main/java/app/mmfpocket/player/MmfAudioRepository.java
            grep -q "r100-ma7-depth4-v1-${VARIANT}" app/src/main/java/app/mmfpocket/player/MmfAudioRepository.java
          fi

      - name: Mark the working copy as a side-by-side test build
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          label="${GITHUB_SHA::7}"
          if [ "${VARIANT:-none}" != none ]; then label="${label} ${VARIANT}"; fi
          sed -i 's/applicationId "app.mmfpocket.player"/applicationId "app.mmfpocket.player.test"/' app/build.gradle
          # The label carries the short commit id (and variant) so the installed build can be told apart.
          sed -i "s|<string name=\"app_name\">MMF Pocket</string>|<string name=\"app_name\">試聴 ${label}</string>|" app/src/main/res/values/strings_clean.xml
          grep -q 'applicationId "app.mmfpocket.player.test"' app/build.gradle
          grep -q "試聴 ${label}" app/src/main/res/values/strings_clean.xml

      - name: Build the release variant
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Align and sign with a throwaway key
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/test-apk"
          mkdir -p "$out"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$unsigned"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          pass="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass "$pass" -keypass "$pass" \
            -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=mmf-pocket-test"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          apk="$out/MMF-Pocket-test-${GITHUB_SHA::8}-${VARIANT:-none}.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/throwaway.jks" --ks-key-alias test \
            --ks-pass "pass:$pass" --key-pass "pass:$pass" --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -v 4 "$apk" > /dev/null
          rm -f "$RUNNER_TEMP/throwaway.jks"
          (cd "$out" && sha256sum "$(basename "$apk")" | tee SHA256SUMS.txt)

      - name: Upload the test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmf-pocket-test-apk-${{ inputs.variant || 'none' }}
          path: ${{ runner.temp }}/test-apk/
          if-no-files-found: error
          retention-days: 3

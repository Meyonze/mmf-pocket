plugins {
    id "com.android.application"
}

def signingProperties = new Properties()
def signingPropertiesPath = System.getenv("MMF_POCKET_KEYSTORE_PROPERTIES")
def signingPropertiesFile = signingPropertiesPath
        ? file(signingPropertiesPath)
        : rootProject.file("keystore.properties")
def hasReleaseSigning = signingPropertiesFile.isFile()
if (hasReleaseSigning) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseStorePassword = System.getenv("MMF_POCKET_STORE_PASSWORD")
        ?: signingProperties["storePassword"]
def releaseKeyPassword = System.getenv("MMF_POCKET_KEY_PASSWORD")
        ?: signingProperties["keyPassword"]

android {
    namespace "app.mmfpocket.player"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "app.mmfpocket.player"
        minSdk 29
        targetSdk 35
        versionCode 24
        versionName "1.5.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingProperties["storeFile"])
                storePassword releaseStorePassword
                keyAlias signingProperties["keyAlias"]
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
}

dependencies {
    // 1.10+ requires compileSdk 36; this project intentionally remains on SDK 35.
    def media3Version = "1.9.3"
    //noinspection GradleDependency
    implementation "androidx.media3:media3-common:$media3Version"
    //noinspection GradleDependency
    implementation "androidx.media3:media3-session:$media3Version"
}

plugins {
    id "com.android.application"
}

def signingProperties = new Properties()
def signingPropertiesPath = System.getenv("MMF_POCKET_KEYSTORE_PROPERTIES")
def signingPropertiesFile = signingPropertiesPath
        ? file(signingPropertiesPath)
        : rootProject.file("keystore.properties")
def hasReleaseSigning = signingPropertiesFile.isFile()
if (hasReleaseSigning) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "app.mmfpocket.player"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "app.mmfpocket.player"
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName "1.4.0-beta.5"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }
}
